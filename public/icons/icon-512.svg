<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="45%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)" />
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4" />
  
  <!-- Emblem Center -->
  <g transform="translate(256, 230)">
    <!-- Temple Gopuram / Pillar Architecture Silhouette -->
    <path d="M-110,80 L-90,-55 L-55,-120 L-18,-155 L0,-165 L18,-155 L55,-120 L90,-55 L110,80 Z" 
          fill="none" stroke="url(#goldGrad512)" stroke-width="10" stroke-linejoin="round" filter="url(#glow)" />
    
    <!-- Open Book Foundation -->
    <path d="M-130,95 C-70,80 -18,90 0,105 C18,90 70,80 130,95 L130,35 C70,20 18,30 0,45 C-18,30 -70,20 -130,35 Z" 
          fill="url(#goldGrad512)" />
    
    <!-- Star of Excellence at Gopuram pinnacle -->
    <polygon points="0,-130 9,-100 38,-100 15,-80 24,-52 0,-70 -24,-52 -15,-80 -38,-100 -9,-100" fill="#fde047" />
    
    <!-- Title Text -->
    <text x="0" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="6">TNPSC</text>
    <text x="0" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#93c5fd" text-anchor="middle" letter-spacing="4">SMART PREP</text>
  </g>
</svg>