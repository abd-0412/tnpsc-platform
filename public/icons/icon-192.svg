<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="188" height="188" rx="40" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
  
  <!-- Emblem Center -->
  <g transform="translate(96, 88)">
    <!-- Temple Gopuram / Achievement Shield Silhouette -->
    <path d="M-40,30 L-32,-20 L-20,-45 L-6,-58 L0,-62 L6,-58 L20,-45 L32,-20 L40,30 Z" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linejoin="round" />
    
    <!-- Open Book Base -->
    <path d="M-46,36 C-24,30 -6,34 0,40 C6,34 24,30 46,36 L46,14 C24,8 6,12 0,18 C-6,12 -24,8 -46,14 Z" fill="url(#goldGrad)" opacity="0.9" />
    
    <!-- Star of Excellence at top -->
    <polygon points="0,-48 3.5,-38 14,-38 5.5,-31 8.5,-21 0,-27 -8.5,-21 -5.5,-31 -14,-38 -3.5,-38" fill="#fbbf24" />
    
    <!-- TNPSC Monogram -->
    <text x="0" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">TNPSC</text>
  </g>
</svg>

